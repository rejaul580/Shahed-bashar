name: Build MBC ERP APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract MBC ERP ZIP
        run: |
          unzip -q MBC-ERP-Android-GitHub-Actions-Ready.zip -d extracted
          test -f extracted/MBC-ERP-Android/settings.gradle.kts
          echo "Project found successfully."

      - name: Run unit tests
        working-directory: extracted/MBC-ERP-Android
        run: gradle test --no-daemon --stacktrace

      - name: Build Debug APK
        working-directory: extracted/MBC-ERP-Android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MBC-ERP-debug-APK
          path: extracted/MBC-ERP-Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
